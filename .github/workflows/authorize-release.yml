name: Authorize release
run-name: Release ${{ inputs.version }} / ${{ inputs.controller_request_id }}

on:
  workflow_dispatch:
    inputs:
      version:
        description: Canonical SemVer without a leading v
        required: true
        type: string
      source_sha:
        description: Exact lowercase 40-character mitosuagent commit SHA
        required: true
        type: string
      build_run_id:
        description: Successful private build workflow run ID
        required: true
        type: string
      controller_request_id:
        description: One-time UUIDv4 generated by the private controller
        required: true
        type: string
      controller_certificate_b64:
        description: Base64 of the controller's one-time public PEM certificate
        required: true
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: release-authorization-${{ github.run_id }}-${{ github.run_attempt }}
  cancel-in-progress: false

jobs:
  authorize:
    name: Create reviewed release authorization
    environment: agent-release-approve
    timeout-minutes: 10
    runs-on:
      group: release-approval
      labels: [self-hosted, Linux, X64, mitosu-release-gate]
    steps:
      - name: Check out gate policy
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Create canonical request
        id: request
        env:
          MITOSU_VERSION: ${{ inputs.version }}
          MITOSU_SOURCE_SHA: ${{ inputs.source_sha }}
          MITOSU_BUILD_RUN_ID: ${{ inputs.build_run_id }}
          MITOSU_CONTROLLER_REQUEST_ID: ${{ inputs.controller_request_id }}
          MITOSU_CONTROLLER_CERTIFICATE_B64: ${{ inputs.controller_certificate_b64 }}
        run: |
          python3 -m release_gate.request release \
            --version "$MITOSU_VERSION" \
            --source-sha "$MITOSU_SOURCE_SHA" \
            --build-run-id "$MITOSU_BUILD_RUN_ID" \
            --controller-request-id "$MITOSU_CONTROLLER_REQUEST_ID" \
            --controller-certificate-b64 "$MITOSU_CONTROLLER_CERTIFICATE_B64" \
            --output authorization

      - name: Mint and seal digest-bound GitHub identity
        env:
          MITOSU_OIDC_AUDIENCE: ${{ steps.request.outputs.audience }}
        run: |
          python3 scripts/seal_oidc_authorization.py \
            --audience "$MITOSU_OIDC_AUDIENCE" \
            --request authorization/request.json \
            --certificate authorization/controller-certificate.pem \
            --output authorization/authorization.cms

      - name: Publish encrypted authorization bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: mitosu-release-authorization-${{ github.run_id }}-${{ github.run_attempt }}
          path: authorization/
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
