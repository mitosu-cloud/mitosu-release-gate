name: Authorize promotion
run-name: Promote ${{ inputs.version }} / ${{ inputs.controller_request_id }}

on:
  workflow_dispatch:
    inputs:
      version:
        description: Canonical SemVer without a leading v
        required: true
        type: string
      manifest_sha256:
        description: Lowercase SHA-256 of the signed release manifest
        required: true
        type: string
      e2e_run_ids:
        description: Comma-separated successful clean-machine E2E run IDs
        required: true
        type: string
      controller_request_id:
        description: One-time UUIDv4 generated by the private controller
        required: true
        type: string
      controller_certificate_b64:
        description: Base64 of the controller's one-time public PEM certificate
        required: true
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: promotion-authorization-${{ github.run_id }}-${{ github.run_attempt }}
  cancel-in-progress: false

jobs:
  authorize:
    name: Create reviewed promotion authorization
    environment: agent-release-promote
    timeout-minutes: 10
    runs-on:
      group: release-approval
      labels: [self-hosted, Linux, X64, mitosu-release-gate]
    steps:
      - name: Check out gate policy
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Create canonical request
        id: request
        env:
          MITOSU_VERSION: ${{ inputs.version }}
          MITOSU_MANIFEST_SHA256: ${{ inputs.manifest_sha256 }}
          MITOSU_E2E_RUN_IDS: ${{ inputs.e2e_run_ids }}
          MITOSU_CONTROLLER_REQUEST_ID: ${{ inputs.controller_request_id }}
          MITOSU_CONTROLLER_CERTIFICATE_B64: ${{ inputs.controller_certificate_b64 }}
        run: |
          IFS=',' read -r -a run_ids <<< "$MITOSU_E2E_RUN_IDS"
          run_arguments=()
          for run_id in "${run_ids[@]}"; do
            run_arguments+=(--e2e-run-id "$run_id")
          done
          python3 -m release_gate.request promotion \
            --version "$MITOSU_VERSION" \
            --manifest-sha256 "$MITOSU_MANIFEST_SHA256" \
            "${run_arguments[@]}" \
            --controller-request-id "$MITOSU_CONTROLLER_REQUEST_ID" \
            --controller-certificate-b64 "$MITOSU_CONTROLLER_CERTIFICATE_B64" \
            --output authorization

      - name: Mint and seal digest-bound GitHub identity
        env:
          MITOSU_OIDC_AUDIENCE: ${{ steps.request.outputs.audience }}
        run: |
          python3 scripts/seal_oidc_authorization.py \
            --audience "$MITOSU_OIDC_AUDIENCE" \
            --request authorization/request.json \
            --certificate authorization/controller-certificate.pem \
            --output authorization/authorization.cms

      - name: Publish encrypted authorization bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: mitosu-promotion-authorization-${{ github.run_id }}-${{ github.run_attempt }}
          path: authorization/
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
